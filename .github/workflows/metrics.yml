name: Update project metrics

on:
  schedule:
    # 每周一 04:00 UTC（北京时间 12:00）
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Collect metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run metrics

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- src/data/project-metrics.json; then
            echo "指标没有变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/project-metrics.json
          git commit -m "自动更新项目指标（$(date -u +%Y-%m-%d)）"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 用 GITHUB_TOKEN 推送的提交不会触发新的 workflow（GitHub 防递归），
      # 所以这里显式调用一次部署。
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
