<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nautilus Reach — hero port district</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink:#e9eef2; --dim:#9cabb8; --accent:#73d7ff; --warm:#ffb46b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#06080b; color:var(--ink);
    font-family:"Avenir Next Condensed","Helvetica Neue",Arial,sans-serif; overflow:hidden; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .hud { position:fixed; pointer-events:none; z-index:10; }
  .title { top:30px; left:34px; max-width:720px; padding:12px 18px 14px; margin:-12px -18px -14px; background:linear-gradient(90deg,rgba(4,9,14,.55),rgba(4,9,14,.22) 60%,transparent); }
  .eyebrow { font-size:10px; letter-spacing:.36em; color:var(--accent); text-transform:uppercase; }
  h1 { margin:5px 0 4px; font-size:46px; line-height:.92; letter-spacing:.055em; font-weight:700;
       text-transform:uppercase; text-shadow:0 2px 24px rgba(0,0,0,.55); }
  .sub { font-size:12px; letter-spacing:.18em; color:var(--dim); text-transform:uppercase; }
  .meta { top:30px; right:34px; text-shadow:0 1px 10px rgba(0,0,0,.9); padding:10px 12px; background:rgba(4,9,14,.36); text-align:right; font-size:10px; line-height:1.85;
          letter-spacing:.13em; color:var(--dim); text-transform:uppercase; }
  .meta b { color:var(--ink); font-weight:600; }
  .foot { left:34px; bottom:26px; font-size:10px; letter-spacing:.12em; color:var(--dim);
          text-transform:uppercase; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .key { display:inline-flex; gap:6px; align-items:center; }
  .key span { border:1px solid rgba(255,255,255,.22); border-radius:3px; padding:2px 6px;
              color:var(--ink); font-size:9px; background:rgba(0,0,0,.28); }
  .controls { pointer-events:auto; display:flex; gap:7px; margin-top:13px; flex-wrap:wrap; }
  button { pointer-events:auto; color:var(--ink); background:rgba(7,12,18,.60);
    border:1px solid rgba(115,215,255,.25); padding:7px 11px; border-radius:2px;
    font:inherit; font-size:10px; letter-spacing:.14em; text-transform:uppercase; cursor:pointer;
    backdrop-filter:blur(8px); }
  button:hover,button.on { border-color:var(--accent); color:#fff; background:rgba(10,28,40,.72); }
  #loading { position:fixed; inset:0; z-index:40; background:#06080b; display:flex;
    align-items:center; justify-content:center; flex-direction:column; gap:18px; transition:opacity .8s; }
  #loading.hide { opacity:0; pointer-events:none; }
  .loadbar { width:300px; height:2px; background:rgba(255,255,255,.12); overflow:hidden; }
  .loadbar i { display:block; height:100%; width:0%; background:var(--accent); transition:width .25s; }
  #loading .small { font-size:10px; letter-spacing:.25em; color:var(--dim); text-transform:uppercase; }
  #err { position:fixed; inset:0; display:none; z-index:50; background:#06080b; padding:44px;
    font-family:monospace; color:#ff9a8a; white-space:pre-wrap; overflow:auto; }
  @media (max-width:820px){ h1{font-size:30px} .meta{display:none} .title{left:18px;top:20px} .foot{left:18px;bottom:16px} }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud title">
  <div class="eyebrow">Kitbash3D K032 / K038 / K046 · native hero kit</div>
  <h1>Nautilus Reach</h1>
  <div class="sub">Port 07 · City Deck 01 · TLOF-01 · A-30</div>
  <div class="controls">
    <button data-cam="wide" class="on">1 · Port wide</button>
    <button data-cam="pad">2 · Pad</button>
    <button data-cam="aerial">3 · Skyline</button>
    <button data-cam="detail">4 · Terminal</button>
    <button id="spin">R · Orbit</button>
    <button id="ao" class="on">G · GTAO</button>
  </div>
</div>
<div class="hud meta">
  <div><b>Nautilus Reach</b> · private sample</div>
  <div id="stat-tris">—</div>
  <div id="stat-calls">—</div>
  <div>7 meshes · one static build</div>
</div>
<div class="hud foot">
  <div class="key"><span>Drag</span> orbit</div>
  <div class="key"><span>Scroll</span> dolly</div>
  <div class="key"><span>1</span><span>2</span><span>3</span><span>4</span> cameras</div>
  <div id="fps">—</div>
</div>
<div id="loading">
  <div class="eyebrow">Nautilus Reach</div>
  <div class="small" id="loadtext">Streaming port kit</div>
  <div class="loadbar"><i id="loadbar"></i></div>
</div>
<div id="err"></div>
<div id="diag" style="position:fixed;left:8px;bottom:8px;z-index:60;color:#6f8;font:10px monospace;background:#000a;padding:4px 8px"></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const app=document.getElementById('app');
const diag=document.getElementById('diag');
function stage(t){diag.textContent=t;window.__stage=t;console.log('STAGE',t)}
stage('boot');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.AgXToneMapping;
renderer.toneMappingExposure=0.64;
renderer.outputColorSpace=THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x9aa7b3,850,4600);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.5,9000);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.055;
controls.minDistance=10; controls.maxDistance=2200;
controls.maxPolarAngle=Math.PI*0.495;
controls.target.set(-4,30,372);

// physical sun + sky fill
const hemi=new THREE.HemisphereLight(0x9fc7ff,0x4b3b2c,0.36); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffb377,1.90);
sun.position.set(-900,360,750);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=10; sun.shadow.camera.far=2600;
sun.shadow.camera.left=-900; sun.shadow.camera.right=900;
sun.shadow.camera.top=900; sun.shadow.camera.bottom=-900;
sun.shadow.bias=-0.00030; sun.shadow.normalBias=0.55;
scene.add(sun);
const fill=new THREE.DirectionalLight(0x6c93d6,0.34); fill.position.set(500,300,500); scene.add(fill);
const rim=new THREE.DirectionalLight(0xff8d59,0.22); rim.position.set(-500,180,-600); scene.add(rim);

const pmrem=new THREE.PMREMGenerator(renderer);
const hdrLoader=new HDRLoader();
let envTexture=null;
try {
  stage('hdr load');
  const hdr=await hdrLoader.loadAsync('../../terrain-sample/sky.hdr');
  hdr.mapping=THREE.EquirectangularReflectionMapping;
  envTexture=pmrem.fromEquirectangular(hdr).texture;
  scene.environment=envTexture;
  scene.environmentIntensity=0.56;
  scene.background=hdr;
  scene.backgroundIntensity=0.50;
  scene.backgroundBlurriness=0.06;
} catch(e) {
  console.warn('HDR unavailable',e);
  scene.background=new THREE.Color(0x8fa3b8);
}
stage('hdr ready');

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const params=new URLSearchParams(location.search);
const useGTAO=params.get('gtao')!=='0';
const gtao=new GTAOPass(scene,camera,innerWidth,innerHeight);
gtao.output=GTAOPass.OUTPUT.Default;
gtao.blendIntensity=0.95;
gtao.updateGtaoMaterial({radius:0.38,distanceExponent:1.2,thickness:1.0,samples:16});
gtao.updatePdMaterial({lumaPhi:10,depthPhi:10,normalPhi:3.2,radius:4,rings:2,samples:12});
gtao.enabled=useGTAO;
composer.addPass(gtao);
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.16,0.5,1.05);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const loader=new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const loadingEl=document.getElementById('loading');
const bar=document.getElementById('loadbar');
const loadtext=document.getElementById('loadtext');

stage('glb request');
loader.load('../glb/nautilus_city.glb', gltf=>{
  stage('glb parsed');
  const root=gltf.scene;
  root.traverse(o=>{
    if(o.isMesh){
      o.castShadow=true; o.receiveShadow=true;
      if(o.material){
        o.material.envMapIntensity=1.15;
        if(o.material.map) o.material.map.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
        o.material.needsUpdate=true;
      }
    }
  });
  scene.add(root);
  let tris=0,mats=new Set();
  root.traverse(o=>{if(o.isMesh){mats.add(o.material);const g=o.geometry;tris+=(g.index?g.index.count:g.attributes.position.count)/3;}});
  document.getElementById('stat-tris').textContent=`${(tris/1e6).toFixed(2)} M tris · ${mats.size} materials`;
  document.getElementById('stat-calls').textContent='Meshopt · WebP · GTAO';
  window.__ready=true; window.__tris=tris; window.__mats=mats.size; stage('ready '+tris);
  bar.style.width='100%'; loadtext.textContent='Ready';
  loadingEl.classList.add('hide'); loadingEl.style.display='none';
},xhr=>{
  if(xhr.total) bar.style.width=Math.min(98,(xhr.loaded/xhr.total)*100)+'%';
  loadtext.textContent=xhr.total?`Streaming · ${(xhr.loaded/1048576).toFixed(1)} MB`:'Streaming port kit';
},err=>{
  console.error(err); window.__error=String(err); stage('ERROR '+String(err));
  const el=document.getElementById('err'); el.style.display='block';
  el.textContent='Failed to load Nautilus Reach.\n\nServe this folder over HTTP from public/city-hero:\n  python3 -m http.server 8765\n\n'+err;
});

const presets={
  wide:   {pos:[-40,26,610],  target:[-24,30,432],  fov:44},
  pad:    {pos:[-48,4.8,496], target:[-2,6.4,420],  fov:36},
  aerial: {pos:[-600,430,980],target:[0,250,-80],   fov:34},
  detail: {pos:[-70,6,520],   target:[-132,12,465], fov:46},
};
let tween=null;
function setCam(name,instant=false){
  const p=presets[name]; if(!p) return;
  if(p.fov){camera.fov=p.fov;camera.updateProjectionMatrix();}
  document.querySelectorAll('[data-cam]').forEach(b=>b.classList.toggle('on',b.dataset.cam===name));
  if(instant){camera.position.set(...p.pos);controls.target.set(...p.target);controls.update();}
  else tween={t:0,fromPos:camera.position.clone(),fromTarget:controls.target.clone(),
              toPos:new THREE.Vector3(...p.pos),toTarget:new THREE.Vector3(...p.target)};
}
const initialCam=params.get('cam')||'wide';
setCam(initialCam,true);
stage('cam '+initialCam+' '+camera.position.toArray().map(v=>v.toFixed(0)).join(','));
document.querySelectorAll('[data-cam]').forEach(b=>b.addEventListener('click',()=>setCam(b.dataset.cam)));
let spin=false;
function toggleSpin(){spin=!spin;controls.autoRotate=spin;controls.autoRotateSpeed=0.28;
  document.getElementById('spin').classList.toggle('on',spin);}
document.getElementById('spin').addEventListener('click',toggleSpin);
let aoOn=true;
document.getElementById('ao').addEventListener('click',()=>{
  aoOn=!aoOn; gtao.enabled=aoOn; document.getElementById('ao').classList.toggle('on',aoOn);
});
addEventListener('keydown',e=>{
  if(e.key==='1')setCam('wide'); if(e.key==='2')setCam('pad');
  if(e.key==='3')setCam('aerial'); if(e.key==='4')setCam('detail');
  if(e.key.toLowerCase()==='r')toggleSpin();
  if(e.key.toLowerCase()==='g'){aoOn=!aoOn;gtao.enabled=aoOn;document.getElementById('ao').classList.toggle('on',aoOn);}
});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
});

let last=performance.now(),frames=0,acc=0;
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(tween){
    tween.t+=dt/1.15;const k=Math.min(1,tween.t);const e=1-Math.pow(1-k,3);
    camera.position.lerpVectors(tween.fromPos,tween.toPos,e);
    controls.target.lerpVectors(tween.fromTarget,tween.toTarget,e);
    if(k>=1)tween=null;
  }
  controls.update();
  composer.render();
  frames++;acc+=dt;
  if(acc>0.8){
    document.getElementById('fps').textContent=Math.round(frames/acc)+' fps';
    if(window.__ready){const calls=renderer.info.render.calls;document.getElementById('stat-calls').textContent=`${calls} draw calls · GTAO + bloom`;}
    frames=0;acc=0;
  }
}
requestAnimationFrame(animate);
</script>
</body>
</html>
